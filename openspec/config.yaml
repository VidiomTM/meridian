schema: spec-driven

# Project context shown to AI when creating artifacts
context: |
  Tech stack: SvelteKit 5, TypeScript, Zod, Vitest, Playwright, pnpm
  Conventions: conventional commits, TDD (Red-Green-Refactor), branch coverage >= 90%
  Domain: OpenSpec workspace browser — reads markdown docs with frontmatter, renders them with cross-references and graph visualization
  Project structure:
    - src/lib/meridian/ — core parsing, formatting, relation graph, force simulation
    - src/lib/components/ — Svelte 5 components (ProjectPicker, DocView, Relations, GraphView)
    - src/routes/ — SvelteKit routes: / (picker), /[project] (overview), /[project]/[docId] (viewer)
    - openspec/specs/ — ADRs and feature specs (this directory)
    - openspec/changes/ — active change tracking

# Per-artifact rules
rules:
  adr:
    - Must include Context, Decision, and Consequences sections
    - Decision should explain rejected alternatives
    - Status must be one of: proposed, accepted, deprecated, superseded
  spec:
    - Each spec must reference the ADRs it depends on
    - Requirements must be numbered (R1, R2, ...)
    - Acceptance criteria must be checkable (prefixed with [ ] or [x])
    - Include a Technical Approach section with file paths and data flow
  design:
    - Include wireframe/mockup references or ASCII diagrams
    - State component hierarchy explicitly
  tdd:
    - Must specify test framework and coverage threshold
    - List test cases by scenario, not by function name
  change:
    - Must reference the artifacts it implements
    - Include risks and mitigations

# Directory paths relative to this config file
paths:
  specs: specs/
  changes: changes/
